<!-- Supabase: Authentication > Email Templates > Invite user
     Subject: You are invited to Whybox -->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#FAFAF7;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#14161A;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAFAF7;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E6E4DE;border-radius:16px;padding:36px 32px;">
            <tr>
              <td style="padding-bottom:28px;">
                <img src="{{ .SiteURL }}/logo.png" width="36" height="36" alt="Whybox" style="display:inline-block;vertical-align:middle;border:0;border-radius:8px;" />
                <span style="display:inline-block;vertical-align:middle;margin-left:10px;font-size:18px;font-weight:600;">Whybox</span>
              </td>
            </tr>
            <tr>
              <td style="font-size:22px;font-weight:600;line-height:1.3;padding-bottom:12px;">You are invited to Whybox</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:1.6;color:#5B6270;padding-bottom:28px;">
                Whybox turns any lesson into an experiment you can play with, explained step by step. Accept the invitation to create your account.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:28px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#14161A;color:#FAFAF7;text-decoration:none;font-size:15px;font-weight:600;border-radius:12px;padding:14px 28px;">Accept the invitation</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.6;color:#8A909C;border-top:1px solid #E6E4DE;padding-top:20px;">
                If you were not expecting this invitation, you can safely ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
